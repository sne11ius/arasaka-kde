name: Native rain build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rain:
    name: Physics, OpenGL, and pointer bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the test environment
        run: docker build --tag arasaka-ci .github/ci
      - name: Build and test native rain with software OpenGL
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" arasaka-ci make test-native
      - name: Retain native test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-rain-logs
          path: |
            build/ci-physics/Testing/Temporary/
            build/ci-native/Testing/Temporary/

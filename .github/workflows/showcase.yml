name: Recorded desktop showcase

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the completed film in the README
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'bin/**'
      - 'native/**'
      - 'plasma/**'
      - 'theme/**'
      - 'manifest/**'
      - 'scripts/showcase/**'
      - 'showcase/**'
      - '.github/showcase/**'
      - '.github/workflows/showcase.yml'

permissions:
  contents: read

concurrency:
  group: recorded-showcase
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      directory: ${{ steps.film.outputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Allow the disposable runner to use KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Build the guest and record the actual tour
        id: film
        run: ./bin/record-showcase all
      - name: Save the film
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: showcase
          path: |
            ${{ steps.film.outputs.directory }}/showcase*.mp4
            ${{ steps.film.outputs.directory }}/poster.png
            ${{ steps.film.outputs.directory }}/chapters.json
            ${{ steps.film.outputs.directory }}/provenance.json
          if-no-files-found: error
      - name: Keep recording diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: showcase-diagnostics
          path: |
            build/showcase/run-*/*.log
            build/showcase/run-*/failed-scene.png
            build/showcase/run-*/failure-screen.png

  publish:
    needs: record
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: showcase
          path: build/film
      - name: Install GitHub CLI with native video attachments
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/cli/cli/releases/download/v2.99.0/gh_2.99.0_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/gh.tar.gz"
          echo "ed4960225d2833e04a61590d9fa2b5773d147f3aa375459e5466a40c102f3832  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.99.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Publish native video and refresh the README
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOWCASE_UPLOAD_TOKEN: ${{ secrets.SHOWCASE_UPLOAD_TOKEN }}
        run: python3 scripts/showcase/publish.py build/film
